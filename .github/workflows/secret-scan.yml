name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  credentials-in-commits:
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret added then deleted in a later commit of the same
      # PR is still published, so scanning the merge result is not enough.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Scan the commits this pull request adds
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/scan_secrets.py \
            --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan the pushed commits
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scan_secrets.py --worktree

      # The scanner is stdlib-only on purpose, so this gate stays green even
      # when the private dependency cannot be resolved. Only pytest is needed.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --quiet pytest

      # --noconftest keeps this job independent of the project's test
      # dependencies. pytest loads tests/conftest.py for anything under tests/,
      # and that file imports pandas, so without this the stdlib-only scanner
      # self-test fails to collect on any branch that adds fixtures.
      - name: Confirm the scanner still catches a synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_scan_secrets.py -q \
            -p no:cacheprovider --noconftest
