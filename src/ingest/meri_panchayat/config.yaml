base_url: "https://egramswaraj.gov.in/meri_panchayat"

# Environment variable holding each endpoint's secret. Names only.
secret_key_env:
  master:           MERI_PANCHAYAT_SECRET_MASTER
  activities:       MERI_PANCHAYAT_SECRET_ACTIVITIES
  activity_summary: MERI_PANCHAYAT_SECRET_ACTIVITY_SUMMARY
  action_plans:     MERI_PANCHAYAT_SECRET_ACTION_PLANS
  funds:            MERI_PANCHAYAT_SECRET_FUNDS
  beneficiaries:    MERI_PANCHAYAT_SECRET_BENEFICIARIES
  gp_profile:       MERI_PANCHAYAT_SECRET_GP_PROFILE
