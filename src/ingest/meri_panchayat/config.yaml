# Meri Panchayat ingestion settings.
#
# This file is tracked. It must never contain an API key, secret or token.
# Credentials are read from the environment at runtime; see .env.example for
# the variable names.

state:
  id: 21
  name: "Odisha"

financial_years:
  - "2019-2020"
  - "2020-2021"
  - "2021-2022"
  - "2022-2023"
  - "2023-2024"
  - "2024-2025"
  - "2025-2026"
  - "2026-2027"

# Blocks and GPs are enumerated per financial year, so a panchayat created or
# reorganised after 2020 is still visited for later years. Set a single year
# here only to pin the hierarchy deliberately.
hierarchy_fin_year: null

output:
  # Relative to the repository root unless it is an absolute path. "~" expands.
  root: "data/raw"
  folder: "meri_panchayat"

# Pilot scope. Extraction is restricted to these GPs; set `all_gps: true` to
# run statewide, which is a separately reviewed decision.
all_gps: false
target_gps:
  - {zp_name: "Khordha",    zp_id: 321, bp_name: "Bhubaneswar",     bp_id: 3823, gp_name: "Andhrua",         gp_code: 119598}
  - {zp_name: "Khordha",    zp_id: 321, bp_name: "Bhubaneswar",     bp_id: 3823, gp_name: "Barimunda",       gp_code: 119599}
