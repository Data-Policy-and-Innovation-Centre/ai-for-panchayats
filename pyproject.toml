[project]
name = "ai-for-panchayats"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dpic",
    "dvc[s3]>=3.67.1",
    "indic-transliteration>=2.3.82",
    "loguru>=0.7.3",
    "pandas>=3.0.3",
    "pandera>=0.31.1",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: scripts, tests and notebooks import `ingest` identically, so no
# runner needs to mutate sys.path.
packages = ["src/ingest"]

[tool.uv.sources]
dpic = { git = "ssh://git@github.com/Data-Policy-and-Innovation-Centre/dpic-org.git", rev = "main" }

[tool.pytest.ini_options]
# "src" for the ingest packages, "." for scripts and the src.* runner imports.
# This is the superset the other open branches need; when resolving a conflict
# against one that lists only ["src"], keep this version.
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
