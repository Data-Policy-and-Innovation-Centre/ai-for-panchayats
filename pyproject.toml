[project]
name = "ai-for-panchayats"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dpic",
    "duckdb>=1.5.5",
    "duckdb-engine>=0.17.0",
    "dvc[s3]>=3.67.1",
    "indic-transliteration>=2.3.82",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandera>=0.31.1",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: scripts, tests and notebooks import these identically, with no
# sys.path mutation anywhere.
packages = ["src/ingest", "src/database"]

[tool.uv.sources]
dpic = { git = "ssh://git@github.com/Data-Policy-and-Innovation-Centre/dpic-org.git", rev = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
